<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TÍCH PHƯỚC ONLINE</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font:15px system-ui;background:#b8d5d0}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#fffdf0df;padding:10px 14px;border:1px solid #8e7956;border-radius:13px;color:#443b2e}#controls{position:fixed;bottom:15px;left:12px;display:grid;grid-template-columns:48px 48px 48px;gap:5px}button,select,input{font:inherit;padding:10px;border:1px solid #8e7956;border-radius:12px;background:#fffdf0e8;color:#443b2e}#up{grid-column:2}#left{grid-column:1}#down{grid-column:2}#right{grid-column:3}#actions{position:fixed;right:12px;bottom:18px;display:grid;gap:8px}#menu{position:fixed;inset:0;background:#17201899;display:grid;place-items:center;padding:20px}#card{background:#fffaf0;padding:22px;border-radius:20px;width:min(360px,100%);color:#40372b}#card h2{margin:0}#card>*{width:100%;margin-top:9px}#start{background:#665039;color:white;font-weight:bold}#msg{position:fixed;bottom:140px;left:12px;background:#fffdf0df;padding:9px;border-radius:10px}#sound{position:fixed;right:12px;top:12px}
</style></head><body><div id="hud"><b>TÍCH PHƯỚC ONLINE</b><br><span id="status">Sân chùa thanh tịnh</span></div>
<button id="sound">♫ Bật nhạc chùa</button>
<div id="controls"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>
<div id="actions"><button id="sit">🪑 Ngồi nghỉ</button><button id="fish">🐟 Ngắm cá</button></div><div id="msg">Chào mừng đến sân chùa!</div>
<div id="menu"><div id="card"><h2>TÍCH PHƯỚC ONLINE</h2><p>Bản thử nghiệm sân chùa 3D.</p><label>Nhân vật</label><select id="gender"><option value="male">Nam</option><option value="female">Nữ</option><option value="novice">Chú tiểu</option></select><label>Tóc</label><select id="hair"><option value="bald">Đầu trọc</option><option value="short">Tóc ngắn</option></select><label>Màu áo</label><select id="robe"><option value="#aaa5bd">Áo xám</option><option value="#d6b84e">Áo vàng – chú tiểu</option></select><input id="name" maxlength="18" placeholder="Nhập pháp danh"><button id="start">VÀO CHÙA</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8d5d0);scene.fog=new THREE.Fog(0xb8d5d0,35,85);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x78836a,2));let sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-10,18,8);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
function box(w,h,d,x,y,z,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function ball(r,x,y,z,c,sx=1,sy=1,sz=1){let m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;scene.add(m);return m}
let floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),mat('#c9b995'));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Cổng tam quan phía trước sân
box(13,.45,.8,0,4.9,16,'#70452f');box(1.1,5.2,.9,-5.8,2.6,16,'#80583d');box(1.1,5.2,.9,5.8,2.6,16,'#80583d');
box(15,.55,1.2,0,5.45,16,'#8b4934');box(14,.25,1.3,0,5.85,16,'#b18a50');
box(4.6,1.1,.22,0,4.85,15.48,'#5b3829');
const gateTitle=new THREE.Mesh(new THREE.BoxGeometry(3.9,.48,.08),new THREE.MeshStandardMaterial({color:'#e6c77b',roughness:.6}));gateTitle.position.set(0,5.05,15.34);scene.add(gateTitle);
function signText(txt,size,x,y,z){let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.clearRect(0,0,512,128);ctx.fillStyle='#f4dfaa';ctx.font=`bold ${size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,256,64);let tex=new THREE.CanvasTexture(c);let m=new THREE.Mesh(new THREE.PlaneGeometry(3.5,.72),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));m.position.set(x,y,z);scene.add(m)}
signText('TÍCH PHƯỚC',54,0,5.05,15.28);signText('CẦU DUYÊN',34,0,4.45,15.27);
// Chánh điện, mái và cột
box(22,.7,3,0,3,-16,'#8d5c3b');for(let x=-9;x<=9;x+=3)box(.3,5,.3,x,3.5,-14.7,'#70452f');
let roof=new THREE.Mesh(new THREE.ConeGeometry(13,3,4),mat('#984b36'));roof.position.set(0,6,-16);roof.rotation.y=Math.PI/4;roof.scale.set(1.2,.5,.42);scene.add(roof);
// Hồ Koi
let pond=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.2,.35,48),mat('#526f68'));pond.position.set(0,.18,-3);scene.add(pond);
let water=new THREE.Mesh(new THREE.CircleGeometry(5.9,48),new THREE.MeshPhysicalMaterial({color:'#4d9995',roughness:.18,transparent:true,opacity:.9}));water.rotation.x=-Math.PI/2;water.position.set(0,.39,-3);scene.add(water);
for(let i=0;i<24;i++){let a=i/24*Math.PI*2;ball(.38,Math.cos(a)*6.1,.35,Math.sin(a)*6.1-3,'#77776a',1.2,.7,.8)}
let fishes=[];for(let i=0;i<12;i++){let g=new THREE.Group(),c=['#e7a34c','#f1eee0','#c94e3d'][i%3];let b=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),mat(c));b.scale.set(1.6,.65,.7);g.add(b);let t=new THREE.Mesh(new THREE.ConeGeometry(.15,.3,8),mat(c));t.rotation.z=-Math.PI/2;t.position.x=-.4;g.add(t);scene.add(g);fishes.push({g,a:i*.52,r:2+i%3*.5,s:.25+i%4*.07})}
// Cây cổ thụ
box(1.4,5,1.4,-11,2.5,-5,'#73513a');for(let i=0;i<65;i++){let a=Math.random()*6.28,r=Math.random()*4.5;ball(.7,-11+Math.cos(a)*r,5.4+Math.random()*1.5,-5+Math.sin(a)*r,'#52784e',1.2,.7,1.1)}
function bench(x,z){box(2,.18,.65,x,1,z,'#795137');for(let dx of [-.75,.75]){box(.16,1,.16,x+dx,.5,z,'#63432f');box(.16,.8,.16,x+dx,1.35,z-.2,'#63432f')}}bench(-8,3);bench(8,3);bench(-8,-1);bench(8,-1);
// Avatar người
let avatar=new THREE.Group();scene.add(avatar);function makeAvatar(g,h,c){avatar.clear();let robe=mat(g==='novice'?'#d6b84e':c),skin=mat('#d8a982'),dark=mat('#282522');let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,6,12),robe);body.position.y=1.2;avatar.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.42,20,16),skin);head.position.y=2.25;head.scale.set(.9,1.08,.9);avatar.add(head);if(h==='short'&&g!=='novice'){let hair=new THREE.Mesh(new THREE.SphereGeometry(.43,20,12,0,Math.PI*2,0,Math.PI*.55),dark);hair.position.y=2.48;avatar.add(hair)}for(let x of [-.15,.15]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),dark);eye.position.set(x,2.28,.37);avatar.add(eye)}for(let x of [-.24,.24]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.65,4,8),robe);arm.position.set(x,1.35,0);avatar.add(arm)}for(let x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.48,4,8),dark);leg.position.set(x,.35,.03);avatar.add(leg)}}
avatar.position.set(0,0,10);makeAvatar('male','bald','#aaa5bd');
document.getElementById('start').onclick=()=>{let n=document.getElementById('name').value.trim()||'Khách hành hương';makeAvatar(document.getElementById('gender').value,document.getElementById('hair').value,document.getElementById('robe').value);document.getElementById('status').textContent='Pháp danh: '+n;document.getElementById('menu').remove()};
let keys={};for(let id of ['up','down','left','right']){let e=document.getElementById(id);e.onpointerdown=ev=>{ev.preventDefault();keys[id]=true};['pointerup','pointerleave','pointercancel'].forEach(v=>e.addEventListener(v,()=>keys[id]=false))}
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let seated=false;
document.getElementById('sit').onclick=()=>{seated=!seated;document.getElementById('msg').textContent=seated?'Bạn đang ngồi nghỉ bên hồ cá.':'Bạn đã đứng dậy.'};
document.getElementById('fish').onclick=()=>document.getElementById('msg').textContent='Đàn cá Koi đang bơi dưới mặt hồ.';
// Âm thanh nền tổng hợp nhẹ, chỉ phát sau khi người chơi chủ động bật
let audioCtx=null,master=null,soundOn=false,notesTimer=null;
function startTempleSound(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();master=audioCtx.createGain();master.gain.value=.12;master.connect(audioCtx.destination);let freqs=[174.61,220,261.63];freqs.forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.035/(i+1);o.connect(g);g.connect(master);o.start()});function bell(){if(!soundOn)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=660+Math.random()*120;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+2.5);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+2.6)}bell();notesTimer=setInterval(bell,12000)}
function stopTempleSound(){if(master)master.gain.setTargetAtTime(0,audioCtx.currentTime,.15);if(notesTimer)clearInterval(notesTimer)}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;if(soundOn){startTempleSound();document.getElementById('sound').textContent='♫ Tắt nhạc chùa'}else{stopTempleSound();document.getElementById('sound').textContent='♫ Bật nhạc chùa'}};
let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04),dx=0,dz=0;if(!seated){if(keys.up||keys.w||keys.arrowup)dz--;if(keys.down||keys.s||keys.arrowdown)dz++;if(keys.left||keys.a||keys.arrowleft)dx--;if(keys.right||keys.d||keys.arrowright)dx++}if(dx||dz){let l=Math.hypot(dx,dz);dx/=l;dz/=l;avatar.position.x=THREE.MathUtils.clamp(avatar.position.x+dx*5*dt,-27,27);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z+dz*5*dt,-25,25);avatar.rotation.y=Math.atan2(dx,dz)}fishes.forEach(f=>{f.a+=dt*f.s;f.g.position.set(Math.cos(f.a)*f.r,.58+Math.sin(f.a*2)*.04,-3+Math.sin(f.a)*f.r);f.g.rotation.y=-f.a});camera.position.lerp(new THREE.Vector3(avatar.position.x,9,avatar.position.z+13),.06);camera.lookAt(avatar.position.x,1,avatar.position.z-1);renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
