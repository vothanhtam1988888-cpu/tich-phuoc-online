<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182a25"><title>TÍCH PHƯỚC – CẦU DUYÊN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#182a25;color:#fff}canvas{display:block;touch-action:none}button,input,select,textarea{font:inherit}button{border:1px solid #c9ad72;background:#fff8e8;color:#463622;border-radius:13px;padding:10px 12px;font-weight:650}#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}#brand,#status{background:#17251fdd;border:1px solid #c5a96c;border-radius:13px;padding:9px 12px}#brand b{display:block;letter-spacing:2px;color:#f3d99e}#brand small{letter-spacing:3px}#status{font-size:12px;text-align:right}#tools{position:fixed;right:10px;top:85px;display:grid;gap:7px}#tools button{background:#17251fdd;color:#fff;border-color:#c9ad72;font-size:12px}#moveHint,#camHint{position:fixed;bottom:12px;background:#17251fc9;padding:8px 10px;border-radius:11px;font-size:10px;pointer-events:none}#moveHint{left:8px}#camHint{right:8px}#leftZone{position:fixed;left:0;bottom:0;width:50%;height:48%;z-index:2;touch-action:none}#rightZone{position:fixed;right:0;bottom:0;width:50%;height:100%;z-index:2;touch-action:none}#overlay,#modal{position:fixed;inset:0;background:#07110edb;display:grid;place-items:center;padding:18px;z-index:10}#panel,.box{width:min(420px,100%);max-height:90vh;overflow:auto;background:#f8f0dc;color:#433726;border-radius:20px;padding:20px}h1{text-align:center;letter-spacing:3px;color:#76502d;margin:0}h3{text-align:center;letter-spacing:4px;color:#98774c;margin:5px 0 15px;font-weight:500}label{display:block;font-size:12px;margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #c9b68e;border-radius:10px;background:#fffdf7;color:#392f24}.row{display:flex;gap:8px}.row>*{flex:1}.primary{width:100%;background:#73502f;color:white;margin-top:12px}#modal{display:none;z-index:8}#modal .box{background:#fff8e9}#modal h2{margin:0;color:#77532f}#modal button{margin:4px}#toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:#17251fee;border:1px solid #c5a96c;padding:9px 13px;border-radius:12px;font-size:12px;display:none;z-index:12;white-space:nowrap}
</style></head><body>
<div id="top"><div id="brand"><b>TÍCH PHƯỚC</b><small>CẦU DUYÊN</small></div><div id="status">Sân chùa thanh tịnh<br><span id="playerLabel">Khách hành hương</span></div></div>
<div id="tools"><button id="profileBtn">👤 Hồ sơ</button><button id="musicBtn">♫ Âm thanh</button><button id="interactBtn">✋ Tương tác</button><button id="helpBtn">ⓘ Hướng dẫn</button></div>
<div id="moveHint">NỬA TRÁI: GIỮ ĐỂ ĐI</div><div id="camHint">NỬA PHẢI: VUỐT ĐỂ XOAY</div><div id="leftZone"></div><div id="rightZone"></div><div id="toast"></div>
<div id="overlay"><div id="panel"><h1>TÍCH PHƯỚC</h1><h3>CẦU DUYÊN</h3><p style="text-align:center;font-size:13px">Thế giới chùa Việt sáng tạo bằng AI.</p><label>Biệt danh</label><input id="nick" maxlength="20" placeholder="Nhập biệt danh"><div class="row"><div><label>Giới tính</label><select id="gender"><option>Nam</option><option>Nữ</option><option>Khác</option></select></div><div><label>Tuổi</label><input id="age" type="number" min="13" max="110" placeholder="Tuổi"></div></div><label>Lời giới thiệu</label><textarea id="bio" rows="2" placeholder="Đôi lời giới thiệu..."></textarea><label>Ảnh avatar</label><input id="avatarFile" type="file" accept="image/*"><button class="primary" id="enter">VÀO THẾ GIỚI TÍCH PHƯỚC</button><p style="font-size:10px;text-align:center">Bản trải nghiệm lưu hồ sơ trên thiết bị này. Chơi nhiều người, kết bạn và nhắn tin thật cần máy chủ ở giai đoạn tiếp theo.</p></div></div>
<div id="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Thông tin</h2><button id="closeModal">Đóng ✕</button></div><div id="modalBody"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8c9bd);scene.fog=new THREE.Fog(0xb8c9bd,45,135);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,240),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf5ff,0x66704e,2.1));const sun=new THREE.DirectionalLight(0xffe2b2,2.4);sun.position.set(-25,35,20);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
function box(w,h,d,x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function ball(r,x,y,z,c,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;scene.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(190,190),mat('#c8b994'));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function tree(x,z,s=1){box(.55*s,3.5*s,.55*s,x,1.75*s,z,'#72513a');for(let i=0;i<18;i++){let a=i*2.4,r=(i%5)*.45*s;ball(.8*s,x+Math.cos(a)*r,3.7*s+(i%4)*.3*s,z+Math.sin(a)*r,'#52734b',1.1,.8,1.05)}}
for(let i=0;i<42;i++){let a=i*2.399,r=24+(i%7)*5;tree(Math.cos(a)*r,Math.sin(a)*r,.8+(i%4)*.12)}
// Cổng tam quan và bảng tên
for(let x of [-7,0,7])box(.8,5.2,.8,x,2.6,24,'#80573b');box(16,.55,1.2,0,5.1,24,'#864b34');box(17,.22,1.4,0,5.45,24,'#c29a5a');
function sign(txt,x,y,z,w,h){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.fillStyle='#f5dfad';g.font='bold 100px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,512,128);const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));m.position.set(x,y,z);scene.add(m)}
sign('TÍCH PHƯỚC',0,5.05,23.35,6.5,1.3);sign('CẦU DUYÊN',0,4.15,23.3,4.8,.8);
// Chánh điện, mái ngói, bậc thềm
box(24,.8,16,0,.4,-37,'#9a7652');for(let x=-10;x<=10;x+=5)box(.45,5,.45,x,2.9,-30,'#765137');
box(27,.7,19,0,5.3,-37,'#9a543b');const roof=new THREE.Mesh(new THREE.ConeGeometry(17,5,4),mat('#8d4935'));roof.position.set(0,7,-37);roof.rotation.y=Math.PI/4;roof.scale.set(1.25,.48,.7);scene.add(roof);
for(let x=-8;x<=8;x+=4)box(1.3,2.2,1.1,x,1.7,-29,'#b18b60');for(let i=0;i<4;i++)box(14,.25,1.2,0,.2+i*.25,-26+i*1.1,'#b7a27d');
ball(1.15,0,2.15,-39,'#c5a66d',.9,1.2,.8);ball(.58,0,3.55,-39,'#c5a66d',1,1.1,.9);ball(.16,0,4.05,-39,'#c5a66d');
// Hồ cá Koi
const pond=new THREE.Mesh(new THREE.CylinderGeometry(9,9,.55,64),mat('#667e68'));pond.position.set(0,.25,-5);scene.add(pond);
const water=new THREE.Mesh(new THREE.CircleGeometry(8.65,64),new THREE.MeshPhysicalMaterial({color:'#4a9a9b',roughness:.13,transparent:true,opacity:.9}));water.rotation.x=-Math.PI/2;water.position.set(0,.56,-5);scene.add(water);
const fish=[];for(let i=0;i<24;i++){const g=new THREE.Group(),c=['#e9a34b','#f2eee0','#c94f3d','#e6c96d'][i%4];const b=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),mat(c));b.scale.set(1.55,.62,.7);g.add(b);const tail=new THREE.Mesh(new THREE.ConeGeometry(.15,.32,8),mat(c));tail.rotation.z=-Math.PI/2;tail.position.x=-.42;g.add(tail);scene.add(g);fish.push({g,a:i*.8,r:2+(i%7)*.72,s:.18+(i%5)*.035})}
for(let z of [5,9,13]){box(18,.28,.85,0,.9,z,'#79543a');box(18,.18,.18,0,1.45,z-.32,'#65442e');for(let x=-8;x<=8;x+=4)box(.22,.85,.22,x,.45,z,'#64452e')}
for(let i=0;i<3;i++){tree(-17-i*3,-12-i*6,1.2);tree(17+i*3,-12-i*6,1.2)}
for(let z of [17,8,-2,-14,-25])for(let x of [-12,12]){box(.18,3,.18,x,1.5,z,'#62442e');ball(.38,x,3.15,z,'#e6b65f',.8,1.1,.8)}
// Nhân vật
const player=new THREE.Group();scene.add(player);player.position.set(0,0,15);let robe=mat('#b5a5bd');
function buildPlayer(){player.clear();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.53,.95,6,12),robe);body.position.y=1.15;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,20,16),mat('#d5a982'));head.position.y=2.25;player.add(head);for(let x of [-.22,.22]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.45,4,8),mat('#443b32'));leg.position.set(x,.35,0);player.add(leg)}}buildPlayer();
const nameCanvas=document.createElement('canvas');nameCanvas.width=512;nameCanvas.height=128;const nameCtx=nameCanvas.getContext('2d'),nameTex=new THREE.CanvasTexture(nameCanvas),nameSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:nameTex,transparent:true}));nameSprite.scale.set(4,1,1);nameSprite.position.set(0,3.2,0);player.add(nameSprite);
let nick='Khách hành hương',gender='Nam',age='',bio='',avatarData='';function setName(n){nameCtx.clearRect(0,0,512,128);nameCtx.fillStyle='rgba(20,35,27,.8)';nameCtx.beginPath();nameCtx.roundRect(20,15,472,98,25);nameCtx.fill();nameCtx.fillStyle='#f4d99b';nameCtx.font='bold 48px sans-serif';nameCtx.textAlign='center';nameCtx.textBaseline='middle';nameCtx.fillText(n||'Khách hành hương',256,65);nameTex.needsUpdate=true}setName(nick);
const saved=JSON.parse(localStorage.getItem('tichphuoc-profile')||'null');if(saved){nick=saved.nick||nick;gender=saved.gender||gender;age=saved.age||'';bio=saved.bio||'';avatarData=saved.avatarData||'';document.querySelector('#nick').value=nick;document.querySelector('#gender').value=gender;document.querySelector('#age').value=age;document.querySelector('#bio').value=bio;setName(nick)}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2300)}
document.querySelector('#avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{avatarData=rd.result;toast('Đã chọn ảnh avatar. Nhấn vào thế giới để lưu.')};rd.readAsDataURL(f)};
function saveProfile(){nick=document.querySelector('#nick').value.trim()||'Khách hành hương';gender=document.querySelector('#gender').value;age=document.querySelector('#age').value;bio=document.querySelector('#bio').value;localStorage.setItem('tichphuoc-profile',JSON.stringify({nick,gender,age,bio,avatarData}));setName(nick);document.querySelector('#playerLabel').textContent=nick;document.querySelector('#overlay').style.display='none';toast('Chào mừng '+nick+' đến Tích Phước!')}
document.querySelector('#enter').onclick=saveProfile;
const modal=document.querySelector('#modal');function openModal(t,h){document.querySelector('#modalTitle').textContent=t;document.querySelector('#modalBody').innerHTML=h;modal.style.display='grid'}document.querySelector('#closeModal').onclick=()=>modal.style.display='none';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelector('#profileBtn').onclick=()=>openModal('Hồ sơ của bạn','<p><b>Biệt danh:</b> '+esc(nick)+'</p><p><b>Giới tính:</b> '+esc(gender)+'　<b>Tuổi:</b> '+esc(age||'Chưa cập nhật')+'</p><p>'+esc(bio||'Chưa có lời giới thiệu.')+'</p><button id="editProfile">Chỉnh sửa hồ sơ</button><p style="font-size:11px">Hồ sơ lưu trên thiết bị này. Avatar đã chọn được lưu cùng hồ sơ.</p>');
document.querySelector('#modalBody').addEventListener('click',e=>{if(e.target.id==='editProfile'){modal.style.display='none';document.querySelector('#overlay').style.display='grid'}});
const songs=['Sáo trúc thanh bình','Thiền không lời','Chuông chùa ngân xa','Đàn tranh dịu êm','Đàn bầu thư thái','Suối chảy và chim hót','Piano thiền','Mõ và chuông nhẹ','Sáo trúc bên hồ sen','Thiền buổi tối'];let audio=null,osc=[],activeSong=-1;
function stopSong(){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];if(audio){audio.close();audio=null}}
function playSong(i){stopSong();activeSong=i;audio=new(window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.05;master.connect(audio.destination);const sets=[[174.61,261.63,349.23],[130.81,196,261.63],[220,329.63,440],[146.83,220,293.66],[164.81,246.94,329.63],[196,293.66,392],[174.61,220,261.63],[110,164.81,220],[196,261.63,392],[130.81,174.61,220]];sets[i].forEach((f,k)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=i===0||i===8?'sine':'triangle';o.frequency.value=f;g.gain.value=.25/(k+1);o.connect(g);g.connect(master);o.start();osc.push(o)});toast('Đang phát: '+songs[i])}
document.querySelector('#musicBtn').onclick=()=>openModal('Âm thanh chùa','<p>Chọn một giai điệu. Đây là âm thanh tổng hợp thử nghiệm, chưa phải bản thu nhạc cụ thật.</p><div>'+songs.map((s,i)=>'<button data-song="'+i+'" style="display:block;width:100%;text-align:left">'+(i+1)+'. '+s+(activeSong===i?'　▶':'')+'</button>').join('')+'</div><button id="stopMusic">Tắt âm thanh</button>');
document.querySelector('#modalBody').addEventListener('click',e=>{if(e.target.dataset.song!==undefined)playSong(Number(e.target.dataset.song));if(e.target.id==='stopMusic'){stopSong();toast('Đã tắt âm thanh')}});
document.querySelector('#helpBtn').onclick=()=>openModal('Cách chơi','<p><b>Nửa trái:</b> chạm giữ và kéo để di chuyển.</p><p><b>Nửa phải:</b> vuốt để xoay camera 360 độ.</p><p>Đến gần ghế, hồ cá hoặc chánh điện rồi chạm Tương tác.</p><p>Hồ sơ đang lưu trên thiết bị. Nhiều người chơi, kết bạn và tin nhắn cần máy chủ ở giai đoạn sau.</p>');
let move={x:0,z:0},leftId=null,rightId=null,lastX=0,lastY=0,yaw=0,pitch=.34;const lz=document.querySelector('#leftZone'),rz=document.querySelector('#rightZone');
lz.onpointerdown=e=>{leftId=e.pointerId;lz.setPointerCapture(leftId);updateMove(e)};lz.onpointermove=e=>{if(e.pointerId===leftId)updateMove(e)};
function updateMove(e){const r=lz.getBoundingClientRect();move.x=THREE.MathUtils.clamp((e.clientX-(r.left+r.width*.5))/85,-1,1);move.z=THREE.MathUtils.clamp((e.clientY-(r.top+r.height*.55))/85,-1,1)}
function endMove(e){if(e.pointerId===leftId){leftId=null;move.x=0;move.z=0}}lz.onpointerup=endMove;lz.onpointercancel=endMove;
rz.onpointerdown=e=>{rightId=e.pointerId;lastX=e.clientX;lastY=e.clientY;rz.setPointerCapture(rightId)};rz.onpointermove=e=>{if(e.pointerId!==rightId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.12,1.05)};rz.onpointerup=e=>{if(e.pointerId===rightId)rightId=null};rz.onpointercancel=rz.onpointerup;
let seated=false;function near(){const p=player.position;if(Math.hypot(p.x,p.z+5)<12)return' hồ cá';if(Math.hypot(p.x,p.z-9)<12)return'ghế nghỉ';if(Math.hypot(p.x,p.z+29)<12)return'chánh điện';return'sân chùa'}
document.querySelector('#interactBtn').onclick=()=>{const n=near();if(n==='ghế nghỉ'){seated=!seated;toast(seated?'Bạn đang ngồi nghỉ trên ghế.':'Bạn đã đứng dậy.')}else if(n===' hồ cá')toast('Bạn đang ngắm đàn cá Koi.');else if(n==='chánh điện')openModal('Hoạt động tại chánh điện','<button data-act="incense">Thắp nhang</button><button data-act="wish">Cầu bình an</button><button data-act="love">Cầu duyên</button>');else openModal('Hoạt động sân chùa','<button data-act="sweep">Quét lá đa</button><button data-act="wish">Cầu bình an</button>')};
document.querySelector('#modalBody').addEventListener('click',e=>{const a={incense:'Bạn thành tâm thắp một nén nhang.',sweep:'Bạn nhẹ nhàng quét lá trong sân chùa.',wish:'Bạn gửi lời cầu bình an.',love:'Bạn gửi lời cầu duyên.'};if(a[e.target.dataset.act]){modal.style.display='none';toast(a[e.target.dataset.act])}});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(!seated){const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const v=f.multiplyScalar(move.z).add(r.multiplyScalar(move.x));if(v.lengthSq()>.01){v.normalize();player.position.addScaledVector(v,7*dt);player.rotation.y=Math.atan2(v.x,v.z)}}player.position.x=THREE.MathUtils.clamp(player.position.x,-78,78);player.position.z=THREE.MathUtils.clamp(player.position.z,-78,38);fish.forEach(f=>{f.a+=dt*f.s;f.g.position.set(Math.cos(f.a)*f.r,.68+Math.sin(f.a*2)*.06,-5+Math.sin(f.a)*f.r);f.g.rotation.y=-f.a});const d=16,target=new THREE.Vector3(player.position.x+Math.sin(yaw)*d,player.position.y+5+pitch*5,player.position.z+Math.cos(yaw)*d);camera.position.lerp(target,.12);camera.lookAt(player.position.x,1.3,player.position.z);renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
