<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TÍCH PHƯỚC – CẦU DUYÊN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b19;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 8px #000}
.brand{font-weight:900;letter-spacing:1px;font-size:16px}.sub{font-size:11px;color:#f2d9a1;letter-spacing:3px}
button{border:1px solid #e8d3a0;background:#18332de8;color:#fff;border-radius:13px;padding:10px 13px;font-weight:700;font-size:13px}
#top button,#actions button,#sound{pointer-events:auto}
#topRight{display:flex;gap:7px}
#hint{position:fixed;top:68px;left:50%;transform:translateX(-50%);font-size:11px;background:#061410a8;padding:7px 12px;border-radius:20px;white-space:nowrap;color:#f7e8c4}
#actions{position:fixed;right:12px;bottom:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#actions button{min-width:112px;background:#17372fe8}
#sound{position:fixed;left:12px;top:70px}
#moveZone{position:fixed;left:0;bottom:0;width:50%;height:48%;z-index:2}
#lookZone{position:fixed;right:0;bottom:0;width:50%;height:62%;z-index:2}
#moveLabel{position:fixed;left:14px;bottom:18px;font-size:10px;color:#ffffffa8;pointer-events:none}
#lookLabel{position:fixed;right:14px;bottom:18px;font-size:10px;color:#ffffffa8;pointer-events:none}
#panel{display:none;position:fixed;inset:0;background:#0009;z-index:5;align-items:center;justify-content:center;padding:18px}
.card{width:min(420px,100%);max-height:85vh;overflow:auto;background:#f7f0df;color:#26332d;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0009}
.card h2{margin:0 0 12px;color:#315b48}.card p{font-size:13px}.card input,.card select,.card textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #c8b995;border-radius:10px;background:#fff;color:#26332d}
.card textarea{min-height:70px}.card button{margin:4px 4px 4px 0;background:#315b48}.close{float:right;background:#7c4738!important}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#102c25ed;padding:10px 15px;border-radius:14px;display:none;z-index:8;font-size:13px}
#nameTag{position:fixed;display:none;z-index:3;transform:translate(-50%,-100%);background:#10251fe8;border:1px solid #e9d5a2;border-radius:12px;padding:5px 9px;font-size:11px;pointer-events:none}
#profilePic{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#d9c99e;border:2px solid #b89454}
#songs button{display:block;width:100%;text-align:left;margin:5px 0}
.small{font-size:11px;color:#64756a}
@media(min-width:800px){#moveZone{width:32%}#lookZone{width:50%}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div><div class="brand">TÍCH PHƯỚC</div><div class="sub">CẦU DUYÊN</div></div><div id="topRight"><button id="profileBtn">Hồ sơ</button><button id="soundBtn">♫ Nhạc</button></div></div>
<div id="hint">Nửa trái: chạm giữ để đi · Nửa phải: vuốt để xoay 360°</div>
<button id="sound">♫ Chọn nhạc</button>
<div id="moveZone"></div><div id="lookZone"></div>
<div id="moveLabel">GIỮ BÊN TRÁI ĐỂ DI CHUYỂN</div><div id="lookLabel">VUỐT BÊN PHẢI ĐỂ XOAY CAMERA</div>
<div id="actions"><button id="sitBtn">🪑 Ngồi / đứng</button><button id="incenseBtn">🪷 Thắp nhang</button><button id="prayBtn">🙏 Cầu bình an</button><button id="rakeBtn">🍂 Quét lá</button><button id="friendsBtn">♡ Bạn bè</button></div>
<div id="nameTag"></div><div id="toast"></div>
<div id="panel"><div class="card"><button class="close" id="closePanel">Đóng</button><div id="panelContent"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb9b1);scene.fog=new THREE.Fog(0x9eb9b1,42,125);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f4ed,0x56634d,2));
const sun=new THREE.DirectionalLight(0xffe4b6,2.5);sun.position.set(-18,28,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const stone=mat(0xaaa99a),wood=mat(0x68442d),darkWood=mat(0x3c2a20),roofMat=mat(0x344b45),gold=mat(0xc4a15a),leaf=mat(0x496e4b),waterMat=new THREE.MeshStandardMaterial({color:0x397f83,roughness:.18,metalness:.12});
function box(w,h,d,x,y,z,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cylinder(rt,rb,h,x,y,z,m,n=12){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function sphere(r,x,y,z,m,sx=1,sy=1,sz=1){let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;scene.add(o);return o}
// Ground, mountain silhouettes and garden
let ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x788b69));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<9;i++){let hill=sphere(12+i%3*2,-55+i*14,2,-58-(i%2)*8,mat(i%2?0x647c68:0x728875),1.7,.45,.7)}
// stone walk
for(let i=0;i<17;i++)box(2.5,.12,2.1,0,.07,13-i*2.1,stone);
// temple main hall
box(21,.8,15,0,2,-22,wood);box(23,.35,17,0,2.55,-22,darkWood);
for(let x of [-9,-4.5,0,4.5,9])for(let z of [-28,-16])cylinder(.28,.34,5.8,x,5.4,z,wood,16);
box(20,.5,14,0,8.2,-22,wood);
function roof(w,d,x,y,z){let r=new THREE.Mesh(new THREE.ConeGeometry(w*.72,2.6,4),roofMat);r.rotation.y=Math.PI/4;r.scale.z=d/w;r.position.set(x,y,z);r.castShadow=true;scene.add(r);box(w,.25,d,x,y-1.15,z,roofMat);for(let xx of [-w/2,w/2])for(let zz of [-d/2,d/2])sphere(.35,x+xx,y-1.05,z+zz,gold)}
roof(24,18,0,10,-22);roof(15,11,0,12,-22);
for(let x of [-3.2,0,3.2]){box(1.2,2.1,.3,x,4.3,-14.35,wood);box(1.4,.25,.4,x,5.4,-14.35,gold)}
// Buddha seated silhouette inside hall
cylinder(.9,1.1,.45,0,3.2,-25,gold,24);sphere(.72,0,4.25,-25,gold,.95,1.15,.8);sphere(.48,0,5.2,-25,gold,.9,1.1,.85);sphere(.08,0,5.22,-24.2,darkWood);sphere(.08,0,5.22,-25.8,darkWood);
for(let x of [-1.7,1.7])sphere(.65,x,3.9,-25,gold,1.3,.5,.8);
// incense burner
cylinder(.45,.65,.7,0,1,-12,gold);cylinder(.08,.12,1.4,0,1.9,-12,darkWood);for(let i=0;i<3;i++)cylinder(.025,.03,.8,(i-1)*.15,2.8,-12,mat(0x9b7040),8);
// pond
let pond=new THREE.Mesh(new THREE.CylinderGeometry(7.5,7.5,.45,48),stone);pond.position.set(15,.15,-5);pond.receiveShadow=true;scene.add(pond);
let water=new THREE.Mesh(new THREE.CircleGeometry(7.15,48),waterMat);water.rotation.x=-Math.PI/2;water.position.set(15,.4,-5);scene.add(water);
for(let i=0;i<15;i++){let a=i/15*Math.PI*2;let fish=sphere(.22,15+Math.cos(a)*3.7,.65,-5+Math.sin(a)*3.7,mat(i%2?0xe6a34c:0xe8e1c9),1.7,.55,.65);fish.userData.a=a;fish.userData.r=3.7;fish.userData.i=i}
const fishMeshes=scene.children.filter(o=>o.userData.a!==undefined);
// benches row
for(let i=0;i<7;i++){let x=-13+i*4.2;box(3.5,.22,.8,x,.85,2,wood);for(let dx of [-1.35,1.35])box(.2,.8,.2,x+dx,.4,2,darkWood)}
// trees
function tree(x,z,s=1){cylinder(.32*s,.48*s,4*s,x,2*s,z,wood,10);for(let i=0;i<4;i++)sphere(2.1*s,x+(Math.random()-.5)*1.2*s,4.2*s+i*.6*s,z+(Math.random()-.5)*1.2*s,leaf,1.1,.85,1)}
for(let i=0;i<18;i++)tree(-25+(i%6)*10,-38+Math.floor(i/6)*17,.8+Math.random()*.45);
// lanterns
for(let x of [-12,12])for(let z of [-12,-2,9]){cylinder(.08,.1,2.8,x,1.4,z,darkWood);box(.7,.7,.7,x,3,z,gold);sphere(.18,x,3,z,mat(0xffdf8a))}
 // player avatar
const player=new THREE.Group();scene.add(player);
let body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.95,5,10),mat(0xc5b99c));body.position.y=1.15;body.castShadow=true;player.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xd6ad8e));head.position.y=2.05;head.castShadow=true;player.add(head);
let robe=new THREE.Mesh(new THREE.CylinderGeometry(.55,.72,1.15,12),mat(0x6e7865));robe.position.y=1.05;player.add(robe);
player.position.set(0,0,7);
let yaw=0,pitch=-.12,camDist=7,sitting=false;
const profile=JSON.parse(localStorage.getItem('tp_profile')||'{"nick":"Khách hành hương","gender":"Chưa chọn","age":"","bio":"","publicGender":true,"publicAge":false}');
let playerName=profile.nick||'Khách hành hương';
const label=document.querySelector('#nameTag');
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2300)}
function openPanel(html){document.querySelector('#panelContent').innerHTML=html;document.querySelector('#panel').style.display='flex'}
function closePanel(){document.querySelector('#panel').style.display='none'}
document.querySelector('#closePanel').onclick=closePanel;
document.querySelector('#profileBtn').onclick=()=>openPanel(`<h2>Hồ sơ người chơi</h2><img id="profilePic" src="${profile.avatar||''}" onerror="this.style.display='none'"><p>Biệt danh</p><input id="nick" value="${playerName}"><p>Giới tính</p><select id="gender"><option>Chưa chọn</option><option>Nam</option><option>Nữ</option><option>Khác</option></select><p>Tuổi</p><input id="age" type="number" min="13" max="120" value="${profile.age||''}"><p>Ảnh đại diện</p><input id="avatar" type="file" accept="image/*"><p>Lời giới thiệu</p><textarea id="bio">${profile.bio||''}</textarea><label><input id="pubGender" type="checkbox" ${profile.publicGender?'checked':''}> Công khai giới tính</label><label><input id="pubAge" type="checkbox" ${profile.publicAge?'checked':''}> Công khai tuổi</label><p class="small">Bản thử nghiệm lưu hồ sơ trên thiết bị này.</p><button id="saveProfile">Lưu hồ sơ</button>`);
document.querySelector('#panelContent').addEventListener('click',e=>{if(e.target.id==='saveProfile'){let f=document.querySelector('#avatar').files[0];const save=avatar=>{Object.assign(profile,{nick:document.querySelector('#nick').value||'Khách hành hương',gender:document.querySelector('#gender').value,age:document.querySelector('#age').value,bio:document.querySelector('#bio').value,publicGender:document.querySelector('#pubGender').checked,publicAge:document.querySelector('#pubAge').checked,avatar});playerName=profile.nick;localStorage.setItem('tp_profile',JSON.stringify(profile));toast('Đã lưu hồ sơ trên thiết bị');closePanel()};if(f){let r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save(profile.avatar||'')}});
document.querySelector('#friendsBtn').onclick=()=>openPanel(`<h2>Bạn bè & trò chuyện</h2><p>Danh sách người chơi sẽ xuất hiện khi kết nối máy chủ trực tuyến.</p><p class="small">Bản hiện tại là bản dựng giao diện; kết bạn và nhắn tin thật cần máy chủ tài khoản.</p><input placeholder="Tìm biệt danh người chơi"><button onclick="alert('Tính năng kết bạn sẽ được kết nối ở bản máy chủ')">Gửi lời mời kết bạn</button><textarea placeholder="Tin nhắn riêng (bản xem trước)"></textarea><button onclick="alert('Tin nhắn thật cần máy chủ trực tuyến')">Gửi tin nhắn</button>`);
document.querySelector('#sitBtn').onclick=()=>{sitting=!sitting;player.position.y=sitting?-.35:0;toast(sitting?'Bạn đang ngồi nghỉ':'Bạn đã đứng dậy')};
document.querySelector('#incenseBtn').onclick=()=>toast('Bạn thành tâm thắp một nén nhang');
document.querySelector('#prayBtn').onclick=()=>toast('Cầu bình an – chúc bạn an yên');
document.querySelector('#rakeBtn').onclick=()=>toast('Bạn đang quét lá trong sân chùa');
const songs=['Tiếng chuông chùa dịu nhẹ','Sáo trúc an yên','Thiền định – suối chảy','Đàn tranh tĩnh tâm','Gió qua rừng trúc','Chuông gió sân chùa','Thiền buổi sớm','Sáo trúc chiều quê','Mưa nhẹ mái chùa','Tĩnh lặng và bình an'];
document.querySelector('#sound').onclick=()=>openPanel('<h2>Chọn nhạc thư giãn</h2><div id="songs">'+songs.map((s,i)=>`<button data-song="${i}">${i+1}. ${s}</button>`).join('')+'</div><p class="small">Âm thanh tổng hợp mẫu; bản nhạc thu âm sẽ được bổ sung sau.</p>');
document.querySelector('#panelContent').addEventListener('click',e=>{if(e.target.dataset.song!==undefined){toast('Đã chọn: '+songs[+e.target.dataset.song]);closePanel()}});
let audioCtx=null,osc=null;document.querySelector('#soundBtn').onclick=()=>{try{audioCtx ||= new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();if(!osc){osc=audioCtx.createOscillator();let gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=174;gain.gain.value=.018;osc.connect(gain).connect(audioCtx.destination);osc.start();}toast('Đã bật âm thanh thiền mẫu')}catch(e){toast('Thiết bị chưa hỗ trợ âm thanh')}};
// Touch movement: left half hold to move; right half drag camera
let moving=false,lastX=0,lastY=0,moveVec={x:0,y:0};const mz=document.querySelector('#moveZone'),lz=document.querySelector('#lookZone');
mz.addEventListener('pointerdown',e=>{moving=true;mz.setPointerCapture(e.pointerId);moveVec.x=(e.clientX/innerWidth-.25)*2;moveVec.y=-1});
mz.addEventListener('pointermove',e=>{if(moving){moveVec.x=Math.max(-1,Math.min(1,(e.clientX/innerWidth-.25)*2));moveVec.y=Math.max(-1,Math.min(1,(e.clientY/innerHeight-.76)*3))}});
['pointerup','pointercancel'].forEach(n=>mz.addEventListener(n,()=>{moving=false;moveVec.x=0;moveVec.y=0}));
lz.addEventListener('pointerdown',e=>{lastX=e.clientX;lastY=e.clientY;lz.setPointerCapture(e.pointerId)});
lz.addEventListener('pointermove',e=>{if(e.buttons||e.pressure){let dx=e.clientX-lastX,dy=e.clientY-lastY;yaw-=dx*.006;pitch=Math.max(-.9,Math.min(.35,pitch+dy*.003));lastX=e.clientX;lastY=e.clientY}});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{if(e.clientY<innerHeight*.65)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(scene.children,true);if(hits.length){let p=hits[0].point;if(Math.hypot(p.x-15,p.z+5)<7.5)toast('Đàn cá Koi đang bơi quanh hồ');}});
function animate(){requestAnimationFrame(animate);let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));if(moving&&!sitting){player.position.addScaledVector(forward,moveVec.y*.105);player.position.addScaledVector(right,moveVec.x*.075);player.rotation.y=yaw}let target=new THREE.Vector3(player.position.x,player.position.y+1.5,player.position.z);let offset=new THREE.Vector3(Math.sin(yaw)*camDist,2.7+pitch*5,Math.cos(yaw)*camDist);camera.position.lerp(target.clone().add(offset),.12);camera.lookAt(target);fishMeshes.forEach(f=>{f.userData.a+=.003;f.position.x=15+Math.cos(f.userData.a)*f.userData.r;f.position.z=-5+Math.sin(f.userData.a)*f.userData.r});renderer.render(scene,camera)}
animate();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
</script>
</body></html>
