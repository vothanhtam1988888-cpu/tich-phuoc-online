#panel{display:none;position:absolute;inset:0;background:#001b20a8;z-index:10;align-items:center;justify-content:center;padding:18px}
#panel.show{display:flex}
.card{width:min(92vw,390px);max-height:80vh;overflow:auto;background:#07383d;border:1px solid #ffffff55;border-radius:18px;padding:18px;box-shadow:0 12px 40px #00151899}
.card h2{margin:0 0 12px;font-size:20px}
.card button{background:#145b59;color:white;border:1px solid #ffffff44;border-radius:10px;padding:10px 13px;margin:4px}
#toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);background:#062d31eF;padding:9px 14px;border-radius:20px;z-index:8;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#hint{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);background:#002d31a8;border-radius:12px;padding:7px 10px;font-size:11px;z-index:3;white-space:nowrap}
@media(max-height:700px){#status{top:88px}#customize{top:145px}#controls{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}#movePad{grid-template-columns:40px 40px 40px;grid-template-rows:38px 38px 38px}.action{padding:9px;font-size:12px;min-height:39px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="top">
 <div class="brand">CÂU CÁ XẢ STRESS<small>THẢ CẦN · NGẮM CÁ · KẾT BẠN</small></div>
 <button class="topbtn" id="profile">👤 Nhân vật</button>
</div>
<div id="status">🎣 Chọn vị trí rồi thả cần câu</div>
<div id="customize"><span style="font-size:11px">Áo:</span>
 <button class="swatch" data-color="#2563eb" style="background:#2563eb" aria-label="Áo xanh"></button>
 <button class="swatch" data-color="#dc2626" style="background:#dc2626" aria-label="Áo đỏ"></button>
 <button class="swatch" data-color="#16a34a" style="background:#16a34a" aria-label="Áo xanh lá"></button>
 <button class="swatch" data-color="#e5e7eb" style="background:#e5e7eb" aria-label="Áo trắng"></button>
 <button class="swatch" data-color="#1f2937" style="background:#1f2937" aria-label="Áo đen"></button>
</div>
<div id="hint">Dùng các mũi tên để đi tới, lui và sang hai bên</div>
<div id="controls">
 <div id="movePad">
  <button class="move" id="up" aria-label="Đi tới">▲</button>
  <button class="move" id="left" aria-label="Đi sang trái">◀</button>
  <button class="move" id="down" aria-label="Đi lui">▼</button>
  <button class="move" id="right" aria-label="Đi sang phải">▶</button>
 </div>
 <div id="actions">
  <button class="action primary" id="cast">🎣 Thả câu</button>
  <button class="action" id="reel" disabled>⬆️ Giật câu</button>
  <button class="action" id="bucket">🪣 Xô cá (0)</button>
 </div>
</div>
<div id="toast"></div>
<div id="panel"><div class="card"><h2 id="panelTitle">Nhân vật</h2><div id="panelBody"></div><button id="closePanel">Đóng</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#world');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.5,10.5);camera.lookAt(0,1.2,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x61756b,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-3,8,5);sun.castShadow=true;scene.add(sun);
const mat=(color,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const skin=mat('#d9a77f'),hair=mat('#24201e'),pants=mat('#27313a'),shoe=mat('#171b20'),rodMat=mat('#4c3422'),lineMat=new THREE.LineBasicMaterial({color:0xf4e8bd});
const avatar=new THREE.Group();scene.add(avatar);
let shirtMat=mat('#2563eb');
function capsule(parent,r,len,material,x,y,z){const g=new THREE.CapsuleGeometry(r,len,6,12);const m=new THREE.Mesh(g,material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function ball(parent,r,material,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;parent.add(m);return m}
const torso=capsule(avatar,.34,.72,shirtMat,0,1.43,0);torso.scale.set(1.05,1,0.58);
ball(avatar,.235,skin,0,2.18,0,1,.98,.9);
ball(avatar,.24,hair,0,2.32,-.015,1,.47,.92);
ball(avatar,.045,skin,-.238,2.18,0);ball(avatar,.045,skin,.238,2.18,0);
const leftLeg=capsule(avatar,.105,.63,pants,-.14,.61,0),rightLeg=capsule(avatar,.105,.63,pants,.14,.61,0);
const leftShoe=ball(avatar,.12,shoe,-.14,.13,.08,1,.55,1.45),rightShoe=ball(avatar,.12,shoe,.14,.13,.08,1,.55,1.45);
const leftArm=capsule(avatar,.085,.58,skin,-.43,1.46,0),rightArm=capsule(avatar,.085,.58,skin,.43,1.46,0);
leftArm.rotation.z=-.22;rightArm.rotation.z=.22;
const hand=ball(avatar,.09,skin,.54,1.18,.02);
const rod=new THREE.Group();avatar.add(rod);
const rodMesh=new THREE.Mesh(new THREE.CylinderGeometry(.025,.045,1.65,8),rodMat);rodMesh.position.set(.65,1.9,-.02);rodMesh.rotation.z=-.42;rod.add(rodMesh);
const rodTip=new THREE.Vector3(.98,2.65,-.02);
const lineGeom=new THREE.BufferGeometry().setFromPoints([rodTip,new THREE.Vector3(1.7,1.0,-.3)]);
const fishingLine=new THREE.Line(lineGeom,lineMat);scene.add(fishingLine);fishingLine.visible=false;
const bobber=ball(scene,.075,mat('#ef4444',.4),1.7,1,-.3);bobber.visible=false;
const fishGroup=new THREE.Group();scene.add(fishGroup);
const fishColors=['#e7a33d','#d7dce3','#d34d35','#e5c95c'];
for(let i=0;i<8;i++){const f=new THREE.Group();const c=mat(fishColors[i%4],.34,.12);ball(f,.17,c,0,0,0,1.55,.62,.65);const tail=new THREE.Mesh(new THREE.ConeGeometry(.11,.22,3),c);tail.position.x=-.28;tail.rotation.z=Math.PI/2;f.add(tail);f.position.set(-2.4+(i%4)*1.25,-.35-(i%2)*.18,-1.5-Math.floor(i/4)*.7);fishGroup.add(f)}
const bucketMesh=new THREE.Group();scene.add(bucketMesh);
const bucketBody=new THREE.Mesh(new THREE.CylinderGeometry(.32,.24,.45,24,1,true),mat('#a8b8b4',.45,.3));bucketBody.position.set(2.35,.1,.4);bucketMesh.add(bucketBody);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.31,.035,8,24),mat('#e5e7eb',.4,.5));rim.rotation.x=Math.PI/2;rim.position.set(2.35,.33,.4);bucketMesh.add(rim);
let move={x:0,z:0},isCasting=false,hasBite=false,fishWaiting=0,caught=0,stored=0,castTimer=null;
const status=document.querySelector('#status'),toastEl=document.querySelector('#toast');
function say(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1700)}
function updateStatus(t){status.textContent=t}
function setShirt(c){shirtMat.color.set(c);say('Đã đổi màu áo')}
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>setShirt(b.dataset.color)));
function setMove(axis,val){move[axis]=val}
const moveButtons={up:['z',-1],down:['z',1],left:['x',-1],right:['x',1]};
for(const [id,[axis,val]] of Object.entries(moveButtons)){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();setMove(axis,val);b.setPointerCapture(e.pointerId)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setMove(axis,0)));
}
document.querySelector('#cast').onclick=()=>{
 if(isCasting){say('Cần câu đang ở dưới nước rồi');return}
 isCasting=true;hasBite=false;fishWaiting=0;fishingLine.visible=true;bobber.visible=true;
 updateStatus('🎣 Đã thả câu — chờ cá cắn câu');say('Đã thả mồi xuống hồ');
 const p=new THREE.Vector3(avatar.position.x+1.65,.9,avatar.position.z-.55);
 bobber.position.copy(p);fishingLine.geometry.setFromPoints([rodTip,p]);
 castTimer=setTimeout(()=>{if(isCasting){hasBite=true;updateStatus('🐟 Cá cắn câu! Bấm “Giật câu”');document.querySelector('#reel').disabled=false;say('Có cá cắn câu! Giật cần lên nào!')}},6500);
};
document.querySelector('#reel').onclick=()=>{
 if(!isCasting){say('Chồng hãy thả câu trước nha');return}
 if(!hasBite){say('Chưa có cá cắn, chờ thêm chút nha');return}
 clearTimeout(castTimer);isCasting=false;hasBite=false;caught++;fishingLine.visible=false;bobber.visible=false;
 document.querySelector('#reel').disabled=true;
 updateStatus('🎉 Câu được 1 con cá! Chọn Xô cá để cất cá');say('Dính cá rồi! Chọn Xô cá để bỏ vào xô');
};
document.querySelector('#bucket').onclick=()=>{
 if(caught>0){stored+=caught;const n=caught;caught=0;document.querySelector('#bucket').textContent=`🪣 Xô cá (${stored})`;updateStatus(`🪣 Đã bỏ ${n} con cá vào xô — tổng ${stored} con`);say(`Đã bỏ ${n} con cá vào xô!`)}
 else {openPanel('🪣 Xô cá',`<p>Trong xô hiện có <b>${stored}</b> con cá.</p><p>${stored?'Cá đã được cất trong xô.':'Chưa có cá. Hãy thả câu, đợi cá cắn rồi giật cần.'}</p>`)}
};
document.querySelector('#profile').onclick=()=>openPanel('👤 Nhân vật',`<p>Nhân vật 3D của bạn.</p><p>Chọn màu áo ngay trên màn hình để thay trang phục.</p><p>Điều khiển bằng bốn nút mũi tên — góc nhìn luôn cố định, không tự xoay màn hình.</p>`);
function openPanel(title,body){document.querySelector('#panelTitle').textContent=title;document.querySelector('#panelBody').innerHTML=body;document.querySelector('#panel').classList.add('show')}
document.querySelector('#closePanel').onclick=()=>document.querySelector('#panel').classList.remove('show');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);
let t=0;
function animate(){
 requestAnimationFrame(animate);t+=.016;
 avatar.position.x+=move.x*.035;avatar.position.z+=move.z*.025;
 avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-2.6,2.0);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-.2,1.8);
 // Giữ hướng camera và nhân vật cố định; chỉ bước chân chuyển động.
 const walking=!!(move.x||move.z);leftLeg.rotation.x=walking?Math.sin(t*10)*.42:0;rightLeg.rotation.x=walking?-Math.sin(t*10)*.42:0;
 leftArm.rotation.x=walking?-Math.sin(t*10)*.24:0;rightArm.rotation.x=walking?Math.sin(t*10)*.24:0;
 if(isCasting){const p=new THREE.Vector3(avatar.position.x+1.65,.9,avatar.position.z-.55);bobber.position.x=p.x;bobber.position.z=p.z;bobber.position.y=.9+Math.sin(t*2)*.035;fishingLine.geometry.setFromPoints([new THREE.Vector3(avatar.position.x+.98,avatar.position.y+2.65,-.02+avatar.position.z),bobber.position])}
 fishGroup.children.forEach((f,i)=>{f.position.x+=Math.sin(t*.6+i)*.0009;f.rotation.y=Math.sin(t*.8+i)*.18});
 renderer.render(scene,camera);
}
animate();
</script>
</body></html>
